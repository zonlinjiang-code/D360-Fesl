/* The poster is the editor. All temporary controls stay out of the export. */
:root{--accent:#141414;--keyboard:0px;--editor-bottom:63px;--surface:#efefec}
*{-webkit-tap-highlight-color:transparent}
.topbar{height:68px}.brand b{font-size:28px;letter-spacing:-1.3px}.topnote,#saveState,.stagebar,.stagefoot{display:none}
.workspace{max-width:1320px;grid-template-columns:minmax(0,1fr) 300px;gap:36px;padding:24px 32px 96px}
.poster-shell{width:min(100%,calc((100vh - 180px)*.6744));max-width:740px;box-shadow:none;isolation:isolate}
.panel{top:92px;max-height:calc(100vh - 180px);padding:0}.panel:empty{display:none}
.panel h1{font-size:27px;letter-spacing:-.8px}.panel .lead{font-size:14px}.panel .section{margin-top:14px;padding-top:14px}
.cell-hit:hover,.cell-hit.focused{box-shadow:none;outline:none}.cell-hit:focus-visible{outline:none}
.hotspots{z-index:2}.poster-control{position:absolute;pointer-events:auto;border:0;padding:0;min-height:0;background:transparent!important;z-index:4;outline:none!important;cursor:pointer}
.poster-shell.picking .poster-control{pointer-events:none}
.poster-control:focus-visible{box-shadow:inset 0 -2px #000}.poster-menu{position:absolute;left:2%;right:2%;top:14%;height:70%;background:var(--paper);z-index:5;overflow:auto;scrollbar-width:thin;padding:0 0 12px;overscroll-behavior:contain}
.poster-menu button{display:block;border:0;padding:0 0 2px;text-align:left;font-weight:700;font-size:clamp(24px,3.5vw,43px);letter-spacing:-1.2px;line-height:1.14;min-height:0;color:#000;border-radius:0}
.poster-menu button:hover{text-decoration:underline;background:none}.poster-menu .topic-custom{display:flex;gap:8px;margin-top:12px}.topic-custom input{font-size:16px;min-width:0}.topic-custom button{font-size:16px;letter-spacing:0;white-space:nowrap}
.dimension-menu{position:absolute;z-index:6;background:var(--paper);padding:4px;top:8%;width:9%;box-shadow:0 6px 14px #0001}
.dimension-menu button{display:block;border:0;width:100%;min-height:36px;padding:0;font-size:clamp(24px,3vw,39px);font-weight:700;line-height:1.2;text-align:center}
.inline-text{position:absolute!important;z-index:3;border:0!important;border-radius:0!important;outline:none!important;box-shadow:none!important;resize:none!important;min-height:0!important;margin:0!important;overflow:hidden!important;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;background:transparent!important;caret-color:currentColor;padding:0;letter-spacing:0;-webkit-text-size-adjust:100%;font-family:Arial,"Microsoft YaHei",sans-serif}
.editor-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}.editor-head button{border:0;min-height:32px;font-size:20px;padding:0 5px}
.tabs{margin:8px 0 12px}.tabs button{font-size:14px}.tool-actions{display:flex;gap:8px}.tool-actions>*{flex:1}.tool-actions button{font-size:13px;padding:9px 5px}

  const brightness=.2126*parseInt(hex.slice(0,2),16)+.7152*parseInt(hex.slice(2,4),16)+.0722*parseInt(hex.slice(4,6),16);

    cell.colorApplied=typeof source.colorApplied==='boolean'
      ?source.colorApplied:!source.asset&&String(source.bg||'').toLowerCase()!=='#f8f8f8';
  }
  for(const [index,cell] of clean.state.shelf.entries()){
    const source=data.state.shelf?.[index];
    cell.colorApplied=typeof source?.colorApplied==='boolean'

shareSettings=function(){if(!isGuest&&(stage!=='result'||confirmedPosterSignature!==posterSignature()||!state.answer.length)){toast('请先作答并确认选择。');return;}modal(`<h2>邀请答题</h2><label class="field"><span>答案方式</span><select id="answerMode"><option value="open" ${state.mode==='open'?'selected':''}>自由选择</option><option value="exact" ${state.mode==='exact'?'selected':''}>以我的选择为标准答案</option></select></label><p class="small">朋友打开题目后，从未勾选的画面开始作答。</p><button class="primary" id="publish" style="width:100%">审核并生成题目链接</button>`);on('answerMode',e=>{state.mode=e.target.value;shareCache=null;scheduleSave();},'change');on('publish',publishQuestion);};
showShare=function(url){modal(`<h2>邀请答题</h2><p class="lead">题目已审核并生成链接。朋友打开后可独立作答。</p><label class="field"><span>题目链接</span><input id="shareURL" type="url" value="${esc(url)}" readonly></label><div class="twocol"><button class="primary" id="copyLink">复制链接</button><button id="openQuestion">打开题目</button></div>`);on('copyLink',async()=>{try{await navigator.clipboard.writeText(url);toast('链接已复制。');}catch{$('shareURL').select();toast('请复制选中的链接。');}});on('openQuestion',()=>window.open(url,'_blank','noopener'));};
publishQuestion=async function(){if(!validQuestion())return;if(isGuest&&questionId)return showShare(questionURL(questionId));if(shareCache)return showShare(shareCache);try{await requireIdentity();const value=await api('/api/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(bundle(false))});shareCache=questionURL(value.id);showShare(shareCache);}catch(e){if(e.message!=='等待微信登录'&&e.message!=='服务尚未配置')toast(e.message,'error');}};
exportPNG=async function(marks=true){if(stage!=='result'||!picks.size){toast('请先完成作答。');return;}try{await requireIdentity();traceId='';const preview=await posterPNGBlob(marks);const reserve=await api('/api/posters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:bundle(false),selection:[...picks],image:await bytesToDataURL(preview)})});traceId=reserve.id;const finalImage=await posterPNGBlob(marks);traceId='';const done=await api(`/api/posters/${reserve.id}/finalize`,{method:'POST',headers:{'Content-Type':'image/png'},body:finalImage});const response=await fetch(done.url,{credentials:'same-origin',cache:'no-store'});if(!response.ok)throw Error('已生成作品，但取回图片失败。');const approved=await response.blob();if(phoneSaveMode())openAlbumPreview(approved,`Design360-${reserve.id}.png`);else download(approved,`Design360-${reserve.id}.png`,'image/png');}catch(e){traceId='';if(e.message!=='等待微信登录'&&e.message!=='服务尚未配置')toast(e.message,'error');}};
let entryGate=null,entryGateBusy=false;
function closeEntryGate(){
  const layer=entryGate;if(!layer)return;
  layer.blocked?.forEach(([element,wasInert])=>{element.inert=wasInert;});
  layer.remove();entryGate=null;document.body.classList.remove('entry-locked');
  document.querySelector('#hotspots button:not(:disabled)')?.focus({preventScroll:true});
}
function showEntryLogin(){
  if(!entryGate)return;
  entryGate.innerHTML='<div class="language-card entry-login-card"><h1>登录后开始互动</h1><p>确认账号与用户协议后，即可开始答题和创作</p><button class="primary" id="entryLogin">继续登录</button><button class="link" id="entryLanguage">返回语言选择</button></div>';
  entryGate.querySelector('#entryLogin').onclick=enterWebsite;
  entryGate.querySelector('#entryLanguage').onclick=()=>{if(entryGateBusy)return;sessionStorage.removeItem('d360-language-v20');showEntryLanguages();};
}
function showEntryLanguages(){
  if(!entryGate)return;
  entryGate.innerHTML='<div class="language-card"><button class="primary" id="chooseEnglish">English</button><button id="chooseChinese" disabled aria-label="中文版本尚未开放">中文</button></div>';
  entryGate.querySelector('#chooseEnglish').onclick=()=>{sessionStorage.setItem('d360-language-v20','en');showEntryLogin();enterWebsite();};
  entryGate.querySelector('#chooseEnglish').focus({preventScroll:true});
}
async function enterWebsite(){
  if(entryGateBusy||!entryGate)return;
  entryGateBusy=true;
  entryGate.querySelectorAll('button').forEach(button=>{button.disabled=true;});
  try{
    let user=await currentSession();
    if(!user?.authenticated||user.consentVersion!==AGREEMENT_VERSION)user=await requireIdentity();
    if(user?.authenticated&&user.consentVersion===AGREEMENT_VERSION)closeEntryGate();
  }catch(error){
    if(!['等待微信登录','服务尚未配置'].includes(error.message))toast(error.message||'登录暂时不可用，请重试','error');
  }finally{
    entryGateBusy=false;
    entryGate?.querySelectorAll('button').forEach(button=>{button.disabled=false;});
    if(entryGate&&!$('dialog').open)entryGate.querySelector('#entryLogin')?.focus({preventScroll:true});
  }
}
function languageLanding(){
  if(entryGate)return;
  const layer=document.createElement('div');layer.className='language-gate';
  layer.setAttribute('role','dialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-label','语言选择与登录');
  layer.blocked=[...document.querySelectorAll('header,main,#mobileDock,#previewBanner')].map(element=>[element,element.inert]);
  layer.blocked.forEach(([element])=>{element.inert=true;});
  document.body.classList.add('entry-locked');document.body.append(layer);entryGate=layer;
  if(sessionStorage.getItem('d360-language-v20')){showEntryLogin();enterWebsite();}else showEntryLanguages();
}
async function bootSafety(){document.addEventListener('click',event=>{if(event.target?.id!=='dockConfirm'||stage!=='entry')return;event.preventDefault();event.stopImmediatePropagation();if(entryPicks.size!==3)return;if([0,2,4].every(i=>entryPicks.has(i))){state=newState();historyStack=[];redoStack=[];go(1);scheduleSave();}else{entryErrors++;renderPanel();toast(entryHint(),'entry');}},true);languageLanding();const auth=new URLSearchParams(location.search).get('auth');if(auth==='ok'){const url=new URL(location.href);url.searchParams.delete('auth');history.replaceState(null,'',url);await restoreAuthContext();}}


// Offline interaction preview. No real identity, moderation, or publication occurs.
let previewAuthenticated=false;
let previewLoginResolve=null;
let previewLoginPending=null;
let previewQuestion=null;
let previewCreator=null;
let previewSequence=0;

currentSession=async function(){return {configured:true,authenticated:previewAuthenticated,consentVersion:previewAuthenticated?AGREEMENT_VERSION:null};};

function previewLogin(){
  modal(`<h2>微信登录与协议 · 流程演示</h2><label class="consent-line"><input id="previewConsent" type="checkbox"><span>我已阅读并同意<a href="#" id="previewReadTerms">《用户创作内容责任约定与隐私说明》</a></span></label><button id="previewLogin" class="primary" style="width:100%" disabled>模拟微信授权并继续</button><p class="small">此处仅模拟登录，不会取得真实微信身份或上传操作记录</p>`);
  $('dialog').addEventListener('close',()=>settlePreviewLogin(null),{once:true});
  on('previewReadTerms',e=>{e.preventDefault();modal(`<h2>用户协议与隐私说明 · 草案</h2><div class="agreement-scroll"><h3>用户创作内容责任约定</h3><div class="agreement-text">${esc(AGREEMENT_TEXT)}</div><h3>身份信息与作品编号</h3><p>${esc(PRIVACY_TEXT)}</p></div><button id="previewTermsBack">返回登录演示</button>`);on('previewTermsBack',previewLogin);});
  on('previewConsent',e=>{$('previewLogin').disabled=!e.target.checked;},'change');
  on('previewLogin',()=>{if(!$('previewConsent')?.checked)return;previewAuthenticated=true;settlePreviewLogin(currentSession());$('dialog').close();toast('已完成模拟授权；没有取得真实微信身份。');});
}

function settlePreviewLogin(value){const done=previewLoginResolve;previewLoginResolve=null;previewLoginPending=null;done?.(value);}
requireIdentity=function(){if(previewAuthenticated)return currentSession();if(previewLoginPending)return previewLoginPending;previewLoginPending=new Promise(resolve=>{previewLoginResolve=resolve;previewLogin();});return previewLoginPending;};

function previewModeration(){
  const choice=$('previewReview')?.value||'pass';
  if(choice!=='pass'){modal('<h2>内容未通过 · 流程演示</h2><p class="lead">模拟审核拦截：请修改文字或图片后重试。此预览不会真正识别违禁内容。</p>');return false;}
  return true;
}

upload=async function(files){
  if(uploadPending||uploadBusy)return;
  const mode=uploadMode;
  const list=selectFilesForUpload(files||[]);
  if(!list.length)return;
  uploadPending=true;
  try{
    if(!await requireIdentity())return;
    if(uploadMode!==mode){toast('上传方式已更改，请重新选择图片。');return;}
    if(!previewModeration())return;
    return await uploadV15(list);
  }finally{uploadPending=false;}
};

function previewGuest(){
  if(!previewQuestion)return;
  previewCreator={question:bundle(),selection:[...picks],stage,step};
  applyBundle(previewQuestion);
  isGuest=true;questionId='preview-only';picks.clear();stage='answer';
  $('dialog').close();render();scrollPanel();previewBanner();
  toast('正在模拟受邀者作答；此题目没有发布。');
}

function previewReturnCreator(){
  if(!previewCreator)return;
  applyBundle(previewCreator.question);picks=new Set(previewCreator.selection);
  isGuest=false;questionId=null;stage=previewCreator.stage;step=previewCreator.step;
  previewCreator=null;render();previewBanner();
}

showShare=function(){
  modal('<h2>邀请答题 · 流程演示</h2><p class="lead">题目已通过模拟审核。下面可以切换到受邀者视角，体验作答、保存以及“我也来创作”。</p><p class="small">此 HTML 尚未接通微信登录、审核和题目存储，不能生成可发送给朋友的真实链接。</p><button class="primary" id="previewOpenGuest" style="width:100%">模拟受邀者打开题目</button>');
  on('previewOpenGuest',previewGuest);
};

publishQuestion=async function(){
  if(!validQuestion())return;
  if(isGuest&&previewQuestion)return showShare();
  if(!await requireIdentity())return;
  if(!previewModeration())return;
  previewQuestion=bundle(false);shareCache='preview-only';showShare();
};

exportPNG=async function(marks=true){
  if(stage!=='result'||!picks.size){toast('请先完成作答。');return;}
  if(!await requireIdentity())return;
  if(!previewModeration())return;
  try{
    previewSequence++;
    traceId=`DEMO-${String(previewSequence).padStart(4,'0')}`;
    const image=await posterPNGBlob(marks),name=`Design360-${traceId}.png`;
    traceId='';
    if(phoneSaveMode())openAlbumPreview(image,name);else download(image,name,'image/png');
    toast('预览海报已生成。DEMO 编号仅用于查看效果，无法追溯身份。');
  }catch(e){traceId='';toast(e.message||'图片生成失败，请重试。','error');}
};

function previewBanner(){
  let banner=$('previewBanner');
  if(!banner){banner=document.createElement('div');banner.id='previewBanner';banner.className='preview-banner';document.body.prepend(banner);if(entryGate){entryGate.blocked.push([banner,banner.inert]);banner.inert=true;}}
  banner.innerHTML=`<div class="preview-actions"><label>模拟审核 <select id="previewReview"><option value="pass">通过</option><option value="block">不通过</option></select></label>${previewCreator?'<button id="previewBack">返回创作者</button>':''}<button id="previewLanguage">重选语言</button></div>`;
  on('previewBack',previewReturnCreator);
  on('previewLanguage',()=>{sessionStorage.removeItem('d360-language-v20');languageLanding();});
}

bootPolished().then(async()=>{await bootSafety();previewBanner();}).catch(e=>console.error('Preview boot failed',e));

</script></body></html>
