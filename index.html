// One proportioned mark for the entry, live selection, animation and PNG export.
// Coordinates use a 100-unit outer diameter; strokes follow that diameter.
function drawSelectionBadge340(ctx,x,y,size,progress=1,scale=1){
 if(!(size>0)||!(scale>0))return;
 ctx.save();
 ctx.translate(x+size/2,y+size/2);ctx.scale(size/100*scale,size/100*scale);ctx.translate(-50,-50);
 ctx.lineCap='butt';ctx.lineJoin='miter';ctx.miterLimit=10;
 ctx.beginPath();ctx.arc(50,50,47.25,0,Math.PI*2);
 ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=5.5;ctx.stroke();
 const a=[21,59],b=[41,78],c=[77,22];
 const short=Math.hypot(b[0]-a[0],b[1]-a[1]),long=Math.hypot(c[0]-b[0],c[1]-b[1]);
 const distance=(short+long)*Math.max(0,Math.min(1,progress));
 if(distance>0){
  ctx.beginPath();ctx.moveTo(...a);
  if(distance<short)ctx.lineTo(a[0]+(b[0]-a[0])*distance/short,a[1]+(b[1]-a[1])*distance/short);
  else{ctx.lineTo(...b);const part=Math.min(1,(distance-short)/long);ctx.lineTo(b[0]+(c[0]-b[0])*part,b[1]+(c[1]-b[1])*part);}
  ctx.lineWidth=7;ctx.stroke();
 }
 ctx.restore();
}

 async function getText(ref){
  if(Object.prototype.hasOwnProperty.call(inline,ref)){
   const value=inline[ref];if(typeof value==='string')return value;
   if(value&&typeof value.base==='string'&&Array.isArray(value.patches)){
    const lines=inline[value.base].match(/[^\n]*\n|[^\n]+$/g)||[],parts=[];let cursor=0;
    for(const [start,end,replacement] of value.patches){parts.push(lines.slice(cursor,start).join(''),replacement);cursor=end;}
    parts.push(lines.slice(cursor).join(''));return parts.join('');
   }
   throw Error(t().failed);
  }
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);
  try{const response=await fetch(ref,{signal:controller.signal});if(!response.ok)throw Error(t().failed);return await response.text();}finally{clearTimeout(timer);}
 }
 function resources(){

  if(editorReady380&&editorFrame)return Promise.resolve();

  const task={token:attempt,timer:0,frame:null,resolve:null,reject:null,promise:null};
  task.promise=new Promise((resolve,reject)=>{task.resolve=resolve;task.reject=reject;});
  editorWarmup380=task;document.body.dataset.editorReady380='loading';
  task.promise.catch(()=>{});
  (async()=>{
   const prepared=await resources();if(task!==editorWarmup380||task.token!==attempt)return;
   const cssBase=new URL(files.css,location.href);
   const css=prepared.css.replace(/url\((['"]?)([^)'"\s]+)\1\)/g,(whole,quote,ref)=>ref.startsWith('data:')?whole:'url('+JSON.stringify(new URL(ref,cssBase).href)+')');
   editorFrame?.remove();editorFrame=document.createElement('iframe');task.frame=editorFrame;
   editorFrame.id='editorFrame320';editorFrame.title=language==='zh'?'海报创作界面':'Poster editor';editorFrame.allow='web-share; clipboard-write';
   editorFrame.setAttribute('aria-hidden','true');editorFrame.setAttribute('inert','');editorFrame.setAttribute('aria-busy','true');editorFrame.tabIndex=-1;
   const code=prepared.code.replace(/<\/script/gi,'<\\/script');
   const base=esc(new URL('.',location.href).href);
   editorFrame.srcdoc=`<!doctype html><html lang="${language==='zh'?'zh-CN':'en'}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><base href="${base}"><style>${css}</style></head><body><script>${code}`+'<'+ '/script></body></html>';
   document.body.append(editorFrame);
   task.timer=setTimeout(()=>failWarmup380(task,Error(t().failed)),75000);
  })().catch(error=>failWarmup380(task,error));

 }
 function openEditor380(){

   const image=new Image(),timer=setTimeout(()=>{image.onload=image.onerror=null;reject(Error(t().failed));},25000);
   image.onload=async()=>{try{if(image.decode)await image.decode();clearTimeout(timer);resolve(image);}catch(error){clearTimeout(timer);reject(error);}};
   image.onerror=()=>{clearTimeout(timer);reject(Error(t().failed));};image.src=files.entry[lang];

 async function choose(lang){
  if(loading&&language===lang){if(!authed&&!$('dialog320').open)login();return;}
  if(!history.state?.d360Journey)history.pushState({d360Journey:true},'',location.href);
   language=lang;attempt++;discardEditor380();editorTask=null;authed=false;clearStatus();

 async function enterIntro(){
  const token=attempt;startLoading('poster');
  try{
   const image=await posterTask;if(token!==attempt||!authed)return;
   $('entryPoster320').src=image.src;
   if($('entryPoster320').decode)await $('entryPoster320').decode();
   if(token!==attempt)return;
   clearStatus();view='intro';$('language320').hidden=true;$('intro320').hidden=false;
   $('guideText320').textContent=t().first;$('help320').textContent=t().help;errors=0;picks.clear();motions.clear();

 // Dates and both logos finish above this line; only the fine print may hide.
 const entryImportantBottom360=2240*r;
 function fit(){
  if(view!=='intro')return;
  const viewport=window.visualViewport,height=viewport?.height||innerHeight;
  const paper=$('paper320'),paperGap=parseFloat(getComputedStyle(paper).marginTop)||0;
  const available=height-$('top320').offsetHeight-$('guide320').offsetHeight-$('entryFooter320').offsetHeight-paperGap-16;
  const widthLimit=Math.max(100,Math.min(document.documentElement.clientWidth-16,innerWidth<=720?Infinity:620));
  const protectedWidth=Math.max(100,available*W/entryImportantBottom360);
  const width=Math.max(Math.min(240,widthLimit),Math.min(widthLimit,protectedWidth));
  paper.style.setProperty('--entry-width320',width+'px');
 }
 function hint(){clearTimeout(promptTimer);$('entryPrompt320').hidden=true;}
 function updateSelection(){
  $('entryStart320').disabled=picks.size!==3||loading;
  $('entryStart320').textContent=picks.size===3?t().start:t().choose(picks.size);
  document.querySelectorAll('[data-entry-cell]').forEach(b=>b.setAttribute('aria-pressed',String(picks.has(+b.dataset.entryCell))));paint();
 }
 function scale(elapsed){
  if(elapsed<=0)return 0;
  for(let i=1;i<keys.length;i++){const [end,value]=keys[i],[start,previous]=keys[i-1];if(elapsed<=end){const q=1-(1-(elapsed-start)/(end-start))**3;return previous+(value-previous)*q;}}
  return 1;
 }
 function badge(x,y,size,elapsed){
  const factor=elapsed>=420?1:scale(elapsed);if(factor<=0)return;
  drawSelectionBadge340(ctx,x,y,size,.2+.8*Math.max(0,Math.min(1,elapsed/200)),factor);
 }
 function paint(){
  ctx.clearRect(0,0,W,H);const size=grid.w/3,now=performance.now();
  for(const index of picks){
   const x=grid.x+(index%3)*size,y=grid.y+Math.floor(index/3)*grid.h/3;
   const inset=size*.035,step=(size-2*inset)/(23+.469),radius=step*.2345;
   ctx.fillStyle='#000';ctx.beginPath();
   for(let row=0;row<24;row++)for(let col=0;col<24;col++){const xx=x+inset+radius+col*step,yy=y+inset+radius+row*step;ctx.moveTo(xx+radius,yy);ctx.arc(xx,yy,radius,0,Math.PI*2);}
   ctx.fill();badge(x,y,size*.265,motions.has(index)?now-motions.get(index):420);
  }
 }
 function animate(now){
  frame=0;for(const [index,start]of motions)if(now-start>=420)motions.delete(index);
  paint();if(motions.size)frame=requestAnimationFrame(animate);
 }
 function select(index){
  if(loading||view!=='intro')return;
  clearEntryError380();
  warmEditor380().catch(()=>{});
  if(picks.has(index)){picks.delete(index);motions.delete(index);}else{picks.add(index);motions.set(index,performance.now());}
  updateSelection();if(motions.size&&!frame)frame=requestAnimationFrame(animate);
 }
 function resetHome(){
  clearEntryError380();attempt++;clearStatus();clearTimeout(promptTimer);cancelAnimationFrame(frame);frame=0;
  discardEditor380();
  document.body.classList.remove('editor-active320');if($('dialog320').open)$('dialog320').close();
  authed=false;view='language';picks.clear();motions.clear();errors=0;editorTask=null;posterTask=null;
  $('intro320').hidden=true;$('language320').hidden=false;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed','false'));
  window.scrollTo({top:0,left:0,behavior:'instant'});

 let entryErrorTimer380=0;
 function clearEntryError380(){

  $('entryStart320').classList.remove('entry-error380');

 function rejectEntry380(){

  void button.offsetWidth;button.classList.add('entry-error380');
  entryErrorTimer380=setTimeout(clearEntryError380,2500);

 async function startEditor(){
  if(loading||view!=='intro')return;
  if(picks.size!==3||![0,2,4].every(index=>picks.has(index))){errors++;rejectEntry380();return;}
  clearEntryError380();if(editorReady380&&editorFrame){openEditor380();return;}

  catch(error){if(token===attempt&&view==='intro')fail(error.message||t().failed);}

 window.addEventListener('message',event=>{
  if(!editorFrame||event.source!==editorFrame.contentWindow||event.data?.channel!=='d360-320')return;
  if(event.data.type==='ready'){
   const task=editorWarmup380;if(!task||task.frame!==editorFrame||task.token!==attempt)return;
   clearTimeout(task.timer);editorWarmup380=null;editorReady380=true;document.body.dataset.editorReady380='ready';editorFrame.setAttribute('aria-busy','false');task.resolve();
  }else if(event.data.type==='entry'){view='intro';editorFrame.dataset.resume360='yes';editorFrame.hidden=true;editorFrame.setAttribute('inert','');editorFrame.setAttribute('aria-hidden','true');document.body.classList.remove('editor-active320');$('intro320').hidden=false;updateSelection();fit();}
  else if(event.data.type==='home')resetHome();
  else if(event.data.type==='error'){const task=editorWarmup380;if(task)failWarmup380(task,Error(event.data.message||t().failed));}
 });
 $('dialogClose320').onclick=()=>$('dialog320').close();
 document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>choose(b.dataset.lang));
 for(let index=0;index<9;index++){

 }
 $('entryStart320').onclick=startEditor;$('home320').onclick=()=>{if(editorFrame?.dataset.resume360==='yes')editorFrame.contentWindow.postMessage({channel:'d360-320',type:'home-request'},'*');else resetHome();};
 window.addEventListener('popstate',()=>{if(view==='language')return;history.pushState({d360Journey:true},'',location.href);if(view==='editor')editorFrame?.contentWindow.postMessage({channel:'d360-320',type:'back'},'*');else if(editorFrame?.dataset.resume360==='yes')editorFrame.contentWindow.postMessage({channel:'d360-320',type:'home-request'},'*');else resetHome();});

// One short response for deliberate presses and newly available selections.
(function installButtonMotion320(){
 const active=new Map(),running=new WeakMap();let scheduled=false;
 const control=button=>!button.matches('.cell-hit,[data-entry-cell],.poster-control,.close320,.close,#closeEditor');
 function key(button){
  if(button.id)return '#'+button.id;
  for(const name of ['topic280','grid280','kind280','method280','lang','swatch'])
   if(button.dataset[name]!==undefined)return name+':'+button.dataset[name];
  return (button.getAttribute('aria-label')||button.textContent.trim()).slice(0,100);
 }
 function selected(button){return !button.disabled&&(button.getAttribute('aria-pressed')==='true'||['primary','active','selected','selected-language'].some(c=>button.classList.contains(c)));}
 function pop(button){
  if(!button.animate||!button.isConnected)return;
  const rect=button.getBoundingClientRect(),size=Math.max(rect.width,rect.height,1);
  // Cap physical movement instead of enlarging wide buttons by a fixed percent.
  // Small options move about 1.6px; controls wider than 240px move only 0.8px.
  const movement=.8+.8*Math.max(0,Math.min(1,(240-size)/80));
  const press=1-Math.min(.035,movement/size),rebound=1+Math.min(.022,movement*.5/size);
  running.get(button)?.cancel();
  running.set(button,button.animate([{transform:`scale(${press})`},{transform:`scale(${rebound})`,offset:.58},{transform:'scale(1)'}],{duration:260,easing:'cubic-bezier(.2,.75,.3,1)'}));
 }
 function scan(){
  scheduled=false;
  document.querySelectorAll('button').forEach(button=>{
   if(!control(button))return;
   const id=key(button),value=selected(button),previous=active.get(id);
   if(value&&previous===false)pop(button);
   active.set(id,value);
  });
 }
 function queue(){if(!scheduled){scheduled=true;requestAnimationFrame(scan);}}
 document.addEventListener('pointerdown',event=>{const b=event.target.closest('button');if(b&&!b.disabled&&control(b))pop(b);},true);
 document.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){const b=event.target.closest('button');if(b&&!b.disabled&&control(b))pop(b);}},true);
 new MutationObserver(queue).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','disabled','aria-pressed']});
 scan();
})();
