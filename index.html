<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="description" content="Create your own 360 Design Festival poster."><title>360 Design Festival · 3.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}#fastEntry{min-height:100vh;min-height:100svh;display:grid;place-content:center;padding:24px}#fastLanguages{width:min(520px,calc(100vw - 48px));display:grid;gap:14px}#fastLanguages button{min-height:58px;padding:12px 20px;border:0;border-radius:8px;background:#f2f2f2;color:#171717;font:400 22px/1.4 Arial,"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer;touch-action:manipulation}#fastLanguages button[aria-pressed=true]{background:#171717;color:#fff}#fastStatus{max-width:520px;min-height:44px;margin:18px 0 0;text-align:center;color:#737373;font-size:14px;line-height:1.6}#fastRetry{justify-self:center;margin-top:8px;padding:10px 22px;border:0;border-radius:8px;background:#171717;color:#fff;font-size:15px;cursor:pointer}#fastRetry[hidden]{display:none}
</style></head><body><main id="fastEntry"><div id="fastLanguages"><button id="fastEnglish" data-lang="en" aria-pressed="false">english</button><button id="fastChinese" data-lang="zh" aria-pressed="false">中文</button></div><p id="fastStatus" role="status" aria-live="polite"></p><button id="fastRetry" hidden>重新加载 / Retry</button><noscript>请允许 JavaScript 以制作海报。 / Enable JavaScript to create your poster.</noscript></main>
<script>
(() => {
  const files = {"css": "site-assets/d360-310-fast/app.9952495d3a13.css", "en": "site-assets/d360-310-fast/app.en.cff04e82f273.js", "zh": "site-assets/d360-310-fast/app.zh.54f861e054c3.js"};
  let busy = false, active = 'en', attempt = 0;
  const status = document.getElementById('fastStatus'), retry = document.getElementById('fastRetry');
  function stylesheet() {
    const existing = document.getElementById('fastStyles');
    if (existing?.sheet) return Promise.resolve();
    existing?.remove();
    return new Promise((resolve, reject) => {
      const link = document.createElement('link'); link.id = 'fastStyles'; link.rel = 'stylesheet'; link.href = files.css;
      const timer = setTimeout(() => { link.remove(); reject(Error('timeout')); }, 25000);
      link.onload = () => { clearTimeout(timer); resolve(); };
      link.onerror = () => { clearTimeout(timer); link.remove(); reject(Error('stylesheet')); };
      document.head.append(link);
    });
  }
  async function start(lang) {
    if (busy) return;
    busy = true; active = lang; retry.hidden = true; const current = ++attempt;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('#fastLanguages button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    status.textContent = lang === 'zh' ? '正在打开…' : 'Opening…';
    const controller = new AbortController();
    const timer = setTimeout(() => { if (current === attempt) { status.textContent = lang === 'zh' ? '连接较慢，请稍候…' : 'The connection is slow. Still preparing…'; } }, 7000);
    const deadline = setTimeout(() => controller.abort(), 25000);
    try {
      const [code] = await Promise.all([
        fetch(files[lang], { signal: controller.signal }).then(r => { if (!r.ok) throw Error('script'); return r.text(); }),
        stylesheet()
      ]);
      if (current !== attempt) return;
      try { sessionStorage.setItem('d360-language-v25', lang); } catch {}
      const script = document.createElement('script'); script.textContent = code; document.body.append(script);
    } catch {
      status.textContent = lang === 'zh' ? '连接暂时不畅，请检查网络后重试。' : 'Connection interrupted. Check your network and try again.';
      retry.textContent = lang === 'zh' ? '重新加载' : 'Retry'; retry.hidden = false;
    } finally { clearTimeout(timer); clearTimeout(deadline); busy = false; }
  }
  document.querySelectorAll('#fastLanguages button').forEach(button => button.onclick = () => start(button.dataset.lang));
  retry.onclick = () => start(active);
  let remembered; try { remembered = sessionStorage.getItem('d360-language-v25'); } catch {}
  if (remembered === 'en' || remembered === 'zh') requestAnimationFrame(() => requestAnimationFrame(() => start(remembered)));
})();
</script></body></html>
