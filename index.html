/* 2.5.7: lay out messages once; animate only opacity or composited scale. */
.toast,.toast[data-kind="info"]{
 width:max-content;max-width:min(calc(100vw - 32px),420px);
 box-sizing:border-box;white-space:normal;overflow-wrap:anywhere;word-break:keep-all;text-wrap:balance;
 transform:translateX(-50%);transition:opacity 140ms ease-out;
}
.toast.show{transform:translateX(-50%)}
.toast.dismissed{transition:none}
button.ui-motion{
 --press-scale:.985;--press-time:160ms;
 scale:1;transform-origin:center;cursor:default;
 transition-property:background-color,color,border-color,scale!important;
 transition-duration:100ms,100ms,100ms,var(--press-time)!important;
 transition-timing-function:ease,ease,ease,cubic-bezier(.215,.61,.355,1)!important;
}
button.ui-motion.is-pressed:not(:disabled):not([aria-disabled="true"]){
 --press-time:80ms;scale:var(--press-scale);
}
/* The shared feedback replaces the older second shrink on language selection. */
.language-selection button[data-pending="true"]{transform:none}
@media(prefers-reduced-motion:reduce){
 button.ui-motion,button.ui-motion.is-pressed{scale:1!important;transition:none!important}
 .toast{transition:none!important}
}
